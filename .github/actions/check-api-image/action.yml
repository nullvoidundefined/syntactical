name: Check the API image
description: >-
  Stages this repository's content, builds the API image locally, runs its start command and
  HEALTHCHECK once, and scans it for key material. The caller provides a Postgres service reachable
  at DATABASE_URL in its environment.

runs:
  using: composite
  steps:
    - name: Stage the image content
      shell: bash
      run: |
        set -euo pipefail
        bash server/scripts/stageBuildContent.sh public
        echo "Content source: public (content/ in this repository)" >> "$GITHUB_STEP_SUMMARY"

    - name: Build the image
      shell: bash
      run: docker build -f server/Dockerfile -t syntactical-api:candidate .

    - name: Run the image's own start command and HEALTHCHECK once
      shell: bash
      run: bash server/scripts/checkImageHealth.sh syntactical-api:candidate

    - name: Prove the key scan catches a planted key
      shell: bash
      run: bash server/scripts/scanImageForKeys.sh --self-test

    - name: Scan the image history and every layer for key material and .ssh directories
      shell: bash
      run: bash server/scripts/scanImageForKeys.sh syntactical-api:candidate
