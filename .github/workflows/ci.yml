name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run content:build && git diff --exit-code content/manifest.json services/content/bundledManifest.generated.ts services/content/bundledBanks.generated.ts
      - run: npm run build

  workspaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:workspaces
      - name: Import the built shared packages from Node
        run: node --input-type=module -e "const a = await import('@syntactical/content-schema'); const b = await import('@syntactical/progress'); if (a.PACKAGE_NAME !== '@syntactical/content-schema' || b.PACKAGE_NAME !== '@syntactical/progress') process.exit(1);"
      - run: npm run typecheck:workspaces
      - run: npm run test:workspaces
