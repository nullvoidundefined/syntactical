name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          # The pipeline's Python oracle checker parses with the same Python as the runner image.
          python-version: '3.13'
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run content:build && git diff --exit-code content/manifest.json services/content/bundledManifest.generated.ts services/content/bundledBanks.generated.ts services/quality/qualityReport.generated.ts
      - run: npm run build

  workspaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          # The pipeline's Python oracle checker parses with the same Python as the runner image.
          python-version: '3.13'
      - run: npm ci
      - run: npm run build:workspaces
      - name: Import the built shared packages from Node
        run: node --input-type=module -e "const a = await import('@syntactical/content-schema'); const b = await import('@syntactical/progress'); if (a.PACKAGE_NAME !== '@syntactical/content-schema' || b.PACKAGE_NAME !== '@syntactical/progress') process.exit(1);"
      - run: npm run typecheck:workspaces
      - name: Run the workspace tests (the Docker oracle tests run in oracle-runners)
        run: npm run test:workspaces
        env:
          SKIP_DOCKER_TESTS: '1'

  server-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          # Reachable only from this job's runner, so trust auth needs no password.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run the server integration tests against the Postgres service
        run: npm run test:integration -w server
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres

  oracle-runners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # No SKIP_DOCKER_TESTS: these run real containers. ensureRunnerImage builds the
      # runner images on demand.
      - name: Run the Docker oracle tests
        working-directory: pipeline
        run: npx vitest run src/__tests__/clients/dockerRunner src/__tests__/services/goldenSet.test.ts
