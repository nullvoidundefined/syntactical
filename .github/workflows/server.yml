name: Server

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'packages/**'
      - 'content/**'
      - 'package-lock.json'
      - 'railway.json'
      - '.github/workflows/server.yml'
      - '.github/actions/check-api-image/**'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          # Reachable only from this job's runner, so trust auth needs no password.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w server
      - run: npm test -w server
      - name: Run the server integration tests against the Postgres service
        run: npm run test:integration -w server
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres

  image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # With the deploy key (a pull request from this repo), the paid banks come from the private
      # content repo, cloned outside Docker. Without it (a fork, or the secret not set yet), the
      # fixture content stands in, so CI still proves the image builds and runs.
      - uses: ./.github/actions/check-api-image
        env:
          DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
        with:
          content-deploy-key: ${{ secrets.CONTENT_DEPLOY_KEY }}
