name: E2E

permissions:
  contents: read

# Runs the web app against the real API and a real Postgres. Only pull requests that touch code
# the browser flows depend on trigger it, so content-only and docs-only changes skip it.
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'state/**'
      - 'services/**'
      - 'clients/**'
      - 'server/**'
      - 'packages/**'
      - 'e2e/**'
      - 'app.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The global setup starts a throwaway postgres:17 container (labelled, removed at the end),
      # applies the migrations, starts the API and the web export, and tears them down.
      - run: npm run e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
