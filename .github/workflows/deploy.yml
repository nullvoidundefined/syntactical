name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The web build's public client keys are repository variables (Settings, Secrets and variables, Actions,
      # Variables), not secrets: each is public by design, and step-level env keeps them away from npm ci. An unset
      # variable is an empty string, which app.config.ts treats as missing.
      - name: Build the Expo web export and content
        env:
          ETHICALADS_PUBLISHER: ${{ vars.ETHICALADS_PUBLISHER }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          REVENUECAT_WEB_BILLING_KEY: ${{ vars.REVENUECAT_WEB_BILLING_KEY }}
        run: npm run build

      # Cloudflare Pages has served https://syntactical.dev since the 2026-10-30 cutover (server/DEPLOY.md, "Web app
      # origin"). A missing secret or project fails this job, so a broken deploy is visible instead of silently skipped.
      - name: Deploy to Cloudflare Pages
        id: cloudflare-deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=syntactical --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '4.153.0'

      - name: Print the Cloudflare deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare-deploy.outputs.deployment-url }}
        run: echo "Cloudflare Pages deployment at $DEPLOYMENT_URL"
