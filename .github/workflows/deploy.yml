name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The web build's public client keys are repository variables (Settings, Secrets and variables, Actions,
      # Variables), not secrets: each is public by design, and step-level env keeps them away from npm ci. An unset
      # variable is an empty string, which app.config.ts treats as missing.
      - name: Build the Expo web export and content
        env:
          ETHICALADS_PUBLISHER: ${{ vars.ETHICALADS_PUBLISHER }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          REVENUECAT_WEB_BILLING_KEY: ${{ vars.REVENUECAT_WEB_BILLING_KEY }}
        run: npm run build

      # Until the owner creates the Cloudflare Pages project and adds both secrets this step is skipped, and GitHub
      # Pages (below) stays the live host. The cutover commit removes the GitHub Pages steps.
      - name: Check the Cloudflare secrets are set
        id: cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'The Cloudflare secrets are not set; skipping the Cloudflare Pages deploy.'
          fi

      # Before the cutover GitHub Pages is the live host, so a Cloudflare failure (a bad token, a missing project) must
      # not fail this job and skip the GitHub Pages deploy. The cutover commit drops continue-on-error with the GitHub
      # steps.
      - name: Deploy to Cloudflare Pages
        if: steps.cloudflare.outputs.configured == 'true'
        id: cloudflare-deploy
        continue-on-error: true
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=syntactical --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '4.153.0'

      - name: Print the Cloudflare deployment URL
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          DEPLOYMENT_OUTCOME: ${{ steps.cloudflare-deploy.outcome }}
          DEPLOYMENT_URL: ${{ steps.cloudflare-deploy.outputs.deployment-url }}
        run: echo "Cloudflare Pages deploy $DEPLOYMENT_OUTCOME; deployment at $DEPLOYMENT_URL"

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
